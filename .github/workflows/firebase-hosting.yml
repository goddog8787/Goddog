name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Project
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: goddog-shop
          VITE_FIREBASE_APP_ID: 1:470116154074:web:6b5fe2382911d3fc3ec3e3
          VITE_FIREBASE_DATABASE_ID: ai-studio-printcore3d-e440897e-fa15-4ea7-94c2-6c136dcf17c4
        run: npm run build


      - name: Deploy to Firebase Hosting
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GODDOG_SHOP }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$SERVICE_ACCOUNT_KEY" ]; then
            echo "$SERVICE_ACCOUNT_KEY" > /tmp/gcp-key.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
          fi
          npx --yes firebase-tools deploy --only hosting --project goddog-shop --non-interactive
