name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check types
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build Project
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_FIREBASE_PROJECT_ID: goddog-shop
          VITE_FIREBASE_APP_ID: 1:470116154074:web:6b5fe2382911d3fc3ec3e3
          VITE_FIREBASE_DATABASE_ID: ai-studio-printcore3d-e440897e-fa15-4ea7-94c2-6c136dcf17c4
        run: npm run build

      - name: Upload website package
        uses: actions/upload-artifact@v4
        with:
          name: Goddog-website
          path: dist/
          if-no-files-found: error

      - name: Wait for the matching Render backend
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          RELEASE_SHA: ${{ github.sha }}
          STOREFRONT_API: ${{ vars.VITE_API_BASE_URL || 'https://goddog.onrender.com' }}
        run: |
          node --input-type=module <<'JS'
          const base = process.env.STOREFRONT_API.replace(/\/+$/, '');
          const read = (path) => fetch(base + path, { signal: AbortSignal.timeout(12000) }).then(response => {
            if (!response.ok) throw new Error('Backend endpoint is not ready');
            return response.json();
          });
          const deadline = Date.now() + 8 * 60 * 1000;
          let ready = false;
          do {
            try {
              const health = await read('/api/health');
              if (health.revision === process.env.RELEASE_SHA) {
                const payment = await read('/api/payment/config-status');
                const inventory = await read('/api/payment/inventory-status');
                ready = payment.configured === true && payment.sandbox === false && inventory.ready === true;
              }
            } catch {
              // Render may still be building or starting the release.
            }
            if (!ready) await new Promise(resolve => setTimeout(resolve, 10000));
          } while (!ready && Date.now() < deadline);
          if (!ready) throw new Error('Matching Render release, production payment config, or Firestore inventory is unavailable');
          JS

      - name: Deploy to Firebase Hosting
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GODDOG_SHOP }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$SERVICE_ACCOUNT_KEY" ]; then
            echo "$SERVICE_ACCOUNT_KEY" > /tmp/gcp-key.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
          fi
          npx --yes firebase-tools deploy --only hosting --project goddog-shop --non-interactive
